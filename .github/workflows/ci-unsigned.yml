name: CI (Unsigned)

# ─────────────────────────────────────────────────────────────────────────────
# 备用流水线 · 未签名打包（不需要任何证书 / 开发者账号）
#
# 用途：当签名版 `ci.yml` 因证书、描述文件、UDID 等问题失败时，用这条流水线先拿到
#      一个可用的 IPA，用 Sideloadly 等工具在本地重签即可安装，不阻塞其他验证工作。
#
# 触发：仅手动（Actions → 左侧 "CI (Unsigned)" → Run workflow）。
#      刻意不挂 push，避免与签名版重复构建、浪费 macOS 分钟数。
#      若希望每次 push 都同时产出一个未签名包，把下面 push 段取消注释即可。
#
# 产物：ReadingApp-unsigned-ipa（未签名，Payload 直压）、dSYM、报告
# ─────────────────────────────────────────────────────────────────────────────
on:
  # push:
  #   branches: [main]
  workflow_dispatch:

# 刻意不设 concurrency 互斥：未签名包仅在手动触发时使用，
# 且历史上曾出现在同一 ref 下被并发组立即取消的问题；
# 这里改为不互斥，保证每次手动触发都能真正跑起来。

permissions:
  contents: read

env:
  SCHEME: ReadingApp
  PROJECT: ReadingApp.xcodeproj
  # 覆盖率门槛（0 = 仅报告；设成 0.60 即要求整体行覆盖率 ≥ 60%）
  COVERAGE_THRESHOLD: "0"

jobs:
  unsigned-package:
    name: 测试 · 未签名 IPA
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ────────────────────────────────────────────────────────── 环境
      - name: 选择 Xcode（优先 16.4，避免 26.x 的新系统行为差异）
        run: |
          set -euo pipefail
          # 选型原则：优先与工程工具链同代的稳定版本。
          # 本工程部署目标 iOS 17、Swift 5.9 语义，镜像里的 Xcode 26.x 虽可编译，
          # 但其自带模拟器是 iOS 26.x，曾导致 JavaScriptCore 在 evaluateScript 处 SIGSEGV，
          # 与本工程代码无关。因此：
          #   1) 有 Xcode_16.4 → 用 16.4（自带 iOS 18.5 SDK，与 iOS 17 目标最接近的稳定线）
          #   2) 否则取 16.x 里最新的
          #   3) 再否则才回退到镜像内最新
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
            echo "使用固定版本 Xcode 16.4"
          else
            echo "::warning::镜像内未找到 Xcode_16.4.app，退回到最新的 16.x"
            X16="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1 || true)"
            if [ -n "${X16:-}" ]; then
              sudo xcode-select -s "$X16/Contents/Developer"
              echo "使用 16.x: $X16"
            else
              echo "::warning::镜像内没有 16.x，回退到最新已安装版本"
              ls -d /Applications/Xcode_*.app 2>/dev/null || true
              LATEST="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)"
              if [ -n "${LATEST:-}" ]; then
                sudo xcode-select -s "$LATEST/Contents/Developer"
                echo "使用最新版本: $LATEST"
              fi
            fi
          fi
          xcodebuild -version
          echo "已安装 Xcode:"; ls -d /Applications/Xcode_*.app 2>/dev/null || true

      - name: 校验模拟器 runtime（优先 iOS 17，其次 18.x）
        run: |
          set -euo pipefail
          RUNTIMES="$(xcrun simctl list runtimes 2>/dev/null || true)"
          printf '%s\n' "$RUNTIMES"
          # 纯 bash 匹配：`grep -q` 会提前关闭管道，配合 pipefail 会把「命中」误判为失败。
          case "$RUNTIMES" in
            *"iOS 17."*) echo "::notice::使用 iOS 17.x runtime 验收（与部署目标一致）" ;;
            *"iOS 18."*) echo "::notice::镜像内无 iOS 17.x，使用 iOS 18.x runtime 验收；部署目标仍为 iOS 17.0" ;;
            *"iOS 26."*) echo "::warning::仅有 iOS 26.x runtime。该环境下曾出现 JavaScriptCore 在 evaluateScript 处 SIGSEGV 而与业务无关，结果需谨慎解读" ;;
            *) echo "::error::未找到任何 iOS 模拟器 runtime"; exit 1 ;;
          esac
          # 打印最终会被选中的目的地，便于排查「跑在了哪个系统上」
          python3 scripts/pick_simulators.py --list | head -8 || true

      # ────────────────────────────────────────────────────────── 缓存
      - name: 缓存 SPM 依赖与 DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
            build/DerivedData
            build/SourcePackages
          # key 与签名版区分（unsigned 后缀），避免两条流水线互相污染 DerivedData。
          # 末尾带 x164：需要与「选择 Xcode」步骤的版本对应，否则会拿另一代 Xcode
          # 生成的 DerivedData 复用，轻则全量重编，重则出现难以解释的链接错误。
          key: ${{ runner.os }}-x16.4-unsigned-${{ hashFiles('**/Package.resolved', 'ReadingApp.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-x16.4-unsigned-

      # ─────────────────────────────────────────── 合规校验（快速失败）
      - name: 工程文件合规校验
        run: python3 scripts/check_project.py

      # ────────────────────────────────────────────────── 全量单元测试
      - name: 全量单元测试 + 覆盖率（iPhone & iPad 双目的地）
        run: bash scripts/acceptance.sh

      # ─────────────────────────────────── Release Archive（关闭签名）
      - name: Archive（Release，关闭代码签名）
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ReadingApp.xcarchive \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            -quiet
          echo "== Archive 产物 =="
          ls -la build/ReadingApp.xcarchive/Products/Applications

      # ────────────────────────────────────────────── 崩溃诊断（仅失败时）
      - name: 收集崩溃报告（失败时）
        if: failure()
        run: |
          set -uo pipefail
          # 模拟器里的 App 崩溃，实际是宿主机上的一个 arm64 进程崩溃，
          # 报告会落在宿主 ~/Library/Logs/DiagnosticReports/*.ips。
          # xcresult 里不含崩溃堆栈，只能从这里拿。
          DIR="$HOME/Library/Logs/DiagnosticReports"
          mkdir -p build/reports/crash
          echo "== $DIR =="
          ls -lat "$DIR" 2>/dev/null | head -20 || echo "目录不存在"
          find "$DIR" -name '*.ips' -mmin -60 2>/dev/null | head -8 | while read -r f; do
            echo ""
            echo "===== $(basename "$f") ====="
            # .ips 是「一行 JSON 头 + 一段 JSON 体」，直接全打，堆栈在 threads 里
            head -c 60000 "$f" || true
            echo ""
            cp "$f" build/reports/crash/ 2>/dev/null || true
          done
          echo "== 已收集 =="
          ls -la build/reports/crash || true

      # ────────────────────────────────────────────────── 导出 IPA
      - name: 导出 IPA（未签名）
        run: |
          set -euo pipefail
          APP_PATH="build/ReadingApp.xcarchive/Products/Applications/ReadingApp.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::未找到 $APP_PATH，Archive 可能失败"
            find build/ReadingApp.xcarchive -maxdepth 3 -type d || true
            exit 1
          fi

          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          ( cd build/ipa && zip -qry ../ReadingApp-unsigned.ipa Payload )

          IPA="build/ReadingApp-unsigned.ipa"
          ls -lh "$IPA"

          # 用文件承接 unzip 输出而不是 `unzip | head`：管道提前关闭会让 unzip 收到
          # SIGPIPE，在 `set -o pipefail` 下会误判为失败。
          echo "== IPA 内容校验 =="
          unzip -l "$IPA" > build/ipa-listing.txt
          head -20 build/ipa-listing.txt
          grep -qE "Payload/ReadingApp\.app/ReadingApp[[:space:]]*$" build/ipa-listing.txt \
            || { echo "::error::IPA 内缺少可执行文件 Payload/ReadingApp.app/ReadingApp"; exit 1; }

          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
            "$APP_PATH/Info.plist" 2>/dev/null || echo "0.0.0")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" \
            "$APP_PATH/Info.plist" 2>/dev/null || echo "0")
          mv "$IPA" "build/ReadingApp-unsigned-${VERSION}-${BUILD}.ipa"
          echo "IPA 最终产物：build/ReadingApp-unsigned-${VERSION}-${BUILD}.ipa"

      # ────────────────────────────────────────────────────── 制品上传
      - name: 上传 IPA 制品（保留 30 天）
        uses: actions/upload-artifact@v4
        with:
          name: ReadingApp-unsigned-ipa
          path: build/ReadingApp-unsigned-*.ipa
          retention-days: 30
          if-no-files-found: error
          compression-level: 0   # IPA 已压缩，避免二次压缩

      - name: 上传 dSYM（崩溃符号化）
        uses: actions/upload-artifact@v4
        with:
          name: ReadingApp-dSYM
          path: build/ReadingApp.xcarchive/dSYMs
          retention-days: 30
          if-no-files-found: warn

      - name: 上传测试与覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-reports
          path: build/reports
          retention-days: 30
          if-no-files-found: warn

      - name: 写入 Job Summary
        if: always()
        run: |
          IPA_FILE=$(ls build/ReadingApp-unsigned-*.ipa 2>/dev/null | head -1 || true)
          {
            echo "## 未签名打包结果"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 任务状态 | ${{ job.status }} |"
            echo "| IPA 制品 | ${IPA_FILE:-未产出（测试阶段失败）} |"
            echo ""
            echo "> 未签名 IPA 需用 Sideloadly / iMazing 等工具重签后安装，详见 docs/交付与安装指南.md"
            echo ""
            if [ -f build/reports/coverage-summary.txt ]; then
              echo "### 覆盖率"; echo '```'; cat build/reports/coverage-summary.txt; echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
