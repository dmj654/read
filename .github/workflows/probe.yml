name: Probe

# 临时诊断用：验证不同 macOS 镜像能否被分配 Runner。
# 已知情况：ubuntu-latest 正常，macos-14 在 0~17 秒内被取消且从未分配 Runner。
on:
  workflow_dispatch:

jobs:
  mac13:
    name: probe-macos-13
    runs-on: macos-13
    timeout-minutes: 5
    steps:
      - name: echo
        run: echo "macos-13 ok"; sw_vers

  mac15:
    name: probe-macos-15
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: echo
        run: echo "macos-15 ok"; sw_vers
